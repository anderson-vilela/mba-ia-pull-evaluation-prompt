services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: prompt-evaluation-dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONPATH=/app/src:/app
    stdin_open: true
    tty: true
    command: tail -f /dev/null
